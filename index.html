<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Ecommerce</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">⚡ TechStore</div>
      <p class="tagline">Catálogo de Produtos</p>
    </div>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="text" placeholder="🔍 Buscar produto..." />
      <select id="category">
        <option value="Todas">Todas as categorias</option>
      </select>
      <button id="btnRender">⟳ Renderizar</button>
    </section>

    <div id="product-list"></div>

    <div id="product-details">
      <p class="details-placeholder">Clique em "Ver detalhes" em um produto para exibir informações aqui.</p>
    </div>
  </main>

  <footer>
    <p>Mini Ecommerce &copy; 2025 — Atividade Prática DOM</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
